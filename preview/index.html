<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rigged Girl Fighter Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #090b14; }
    canvas { display: block; }
    #hud { position: fixed; inset: 20px auto auto 20px; padding: 16px 18px; border: 1px solid #ffffff24; border-radius: 14px; background: #111526d9; backdrop-filter: blur(12px); box-shadow: 0 12px 40px #0008; }
    h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .02em; }
    p { margin: 0 0 12px; color: #aeb7d4; font-size: 12px; }
    button { margin: 3px; padding: 8px 11px; color: #eef1ff; background: #252d4d; border: 1px solid #ffffff1e; border-radius: 8px; cursor: pointer; }
    button:hover, button.active { background: #7b5cff; }
    #status { margin-top: 10px; color: #b9c2e5; font-size: 12px; }
  </style>
</head>
<body>
  <div id="hud"><h1>Stylized Girl · Humanoid Rig</h1><p>One skinned fighter, one skeleton, hand-bound bat.</p>
    <div><button data-clip="Fight_Idle" class="active">Fight idle</button><button data-clip="Punch_Jab">Punch jab</button><button data-clip="Bat_Swing">Bat swing</button><button data-clip="Kick_High">High kick</button></div>
    <div id="status">Loading model…</div>
  </div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b14);
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .01, 100);
    camera.position.set(1.9, 1.5, 4.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1, 0); controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xb9c8ff, 0x171322, 2.1));
    const key = new THREE.DirectionalLight(0xffd8bd, 3.5); key.position.set(3, 5, 4); key.castShadow = true; scene.add(key);
    const rim = new THREE.PointLight(0x7665ff, 18, 8); rim.position.set(-3, 1.8, -2); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(2.8, 64), new THREE.MeshStandardMaterial({ color: 0x171b2d, roughness: .78, metalness: .05 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 1.39, 64), new THREE.MeshBasicMaterial({ color: 0x705dff, transparent: true, opacity: .7, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = .008; scene.add(ring);

    let model, mixer, activeAction;
    const status = document.querySelector('#status');
    function playClip(name) {
      if (!mixer || !model) return;
      const clip = THREE.AnimationClip.findByName(model.userData.clips, name);
      if (!clip) return;
      const next = mixer.clipAction(clip);
      next.reset().setLoop(name === 'Fight_Idle' ? THREE.LoopRepeat : THREE.LoopOnce, name === 'Fight_Idle' ? Infinity : 1);
      next.clampWhenFinished = name !== 'Fight_Idle';
      if (activeAction && activeAction !== next) activeAction.fadeOut(.15);
      next.fadeIn(.15).play(); activeAction = next;
      status.textContent = `${name.replace('_', ' ')} · ${clip.duration.toFixed(2)}s · drag to orbit`;
    }
    new GLTFLoader().load('../assets/models/the_girl_rigged/stylized_girl_fighter_rig.glb', gltf => {
      model = gltf.scene; model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
      // glTF is Y-up in the browser even though the Blender source is Z-up.
      model.position.x -= center.x; model.position.y -= box.min.y; model.position.z -= center.z; const scale = 2.05 / size.y; model.scale.setScalar(scale); scene.add(model);
      model.userData.clips = gltf.animations; mixer = new THREE.AnimationMixer(model); playClip('Fight_Idle');
    }, undefined, e => status.textContent = 'Could not load model: ' + e.message);
    document.querySelectorAll('button').forEach(b => b.onclick = () => { playClip(b.dataset.clip); document.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b)); });
    addEventListener('keydown', e => { const clip = { '1':'Fight_Idle','2':'Punch_Jab','3':'Bat_Swing','4':'Kick_High' }[e.key]; if (clip) document.querySelector(`[data-clip="${clip}"]`).click(); });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    const clock = new THREE.Clock();
    function animate() { requestAnimationFrame(animate); const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      controls.update(); renderer.render(scene, camera);
    } animate();
  </script>
</body>
</html>
